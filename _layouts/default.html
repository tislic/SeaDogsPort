<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">

<!-- Для iPhone / iPad -->
<link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">

<!-- Для Android -->
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/icons/icon-512.png' | relative_url }}">

<meta name="theme-color" content="#263f49">

<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="phase-{{ site.phase }}">

<header class="header">
  <div class="header-inner">
    <img class="header-logo"
         src="{{ '/assets/design/logo.png' | relative_url }}"
         alt="Логотип Порт Корсаров"
         onerror="this.style.display='none'">
    <div class="header-text">
      <h1>{{ site.title }}</h1>
      <p>{{ site.description }}</p>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-inner">
{% for item in site.nav[site.phase] %}
  {% assign slug = item | downcase | replace: ' ', '-' %}
  {% if slug == 'главная' %}
    <a href="{{ '/' | relative_url }}">{{ item }}</a>
  {% else %}
    <a href="{{ '/' | append: slug | append: '/' | relative_url }}">{{ item }}</a>
  {% endif %}
{% endfor %}
    </div>
  </nav>
</header>

<main class="wrap">
  {{ content }}
</main>

<div class="footer-scenery" aria-hidden="true"></div>

<footer class="footer">
  {{ site.title }} · {{ site.description }}
</footer>

</body>
</html>
