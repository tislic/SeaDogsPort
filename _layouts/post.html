---
layout: default
---

<!--
  POST — обычная страница/запись с оформлением «статьи».
  Используется всеми файлами _posts/*.md и обычными информационными
  страницами вроде «О проекте» и «Что изменилось».
  Наследуется от default, поэтому отдельной шапки/меню здесь нет.
  Не использовать для страницы «Сборки»: для неё предназначен builds.
-->

<article class="panel post" style="padding: 40px; background:rgba(255,253,248,.89);">

  {% if page.image %}
    <div class="post-hero">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    </div>
  {% endif %}

  <div class="meta">
    {{ page.date | date: "%d.%m.%Y" }}
    {% if page.version %} · {{ page.version }}{% endif %}
  </div>

  <h1 style="font-size:2rem; font-weight:normal; margin:10px 0 20px;">{{ page.title }}</h1>

  <div class="post-content" style="color:#4d5357; line-height:1.75;">
    {{ content }}
  </div>

  {% if page.tags %}
  <div class="tags" style="margin-top:30px; padding-top:20px; border-top:1px solid #d8d2c5;">
    {% for tag in page.tags %}
      <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}

  <p style="margin-top:30px;">
    <a class="read" href="{{ '/' | relative_url }}">← Все записи</a>
  </p>

</article>
