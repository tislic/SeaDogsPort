name: Build local Beaudar

on:
  push:
    paths:
      - ".github/workflows/build-beaudar.yml"
      - "scripts/build-beaudar.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "16"
      - name: Build Russian Beaudar
        run: node scripts/build-beaudar.mjs
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/beaudar
          if git diff --cached --quiet; then
            echo "No Beaudar changes."
            exit 0
          fi
          git commit -m "Build local Russian Beaudar"
          git push
