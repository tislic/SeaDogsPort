name: Build local Beaudar

on:
  push:
    paths:
      - ".github/workflows/build-beaudar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "16"
      - name: Build Beaudar
        run: |
          rm -rf beaudar-build
          git clone --depth 1 https://github.com/beaudar/beaudar.git beaudar-build
          cd beaudar-build
          python3 - <<'PY'
          from pathlib import Path
          R=[
            ("没有可预览的内容","Предпросмотр пока пуст"),
            ("发表评论","Опубликовать комментарий"),
            ("支持 Markdown 格式","Поддерживается Markdown"),
            ("写下您的评论","Напишите комментарий"),
            ("登录后评论","Войдите, чтобы оставить комментарий"),
            ("加载预览中…","Загрузка предпросмотра…"),
            ("加载更多","Загрузить ещё"),
            ("加载中…","Загрузка…"),
            ("还没有评论","Комментариев пока нет"),
            ("评论","Комментарий"),
            ("编辑","Редактировать"),
            ("预览","Предпросмотр"),
            ("刷新","Обновить"),
            ("登录","Войти"),
            ("系统消息","Системное сообщение"),
            ("选择你的表情符号","Выбери реакцию"),
            ("Token 请求失败","Ошибка получения токена"),
            ("无法从 GitHub 获取数据","Не удалось получить данные GitHub"),
            ("搜索 Issues 失败。","Не удалось выполнить поиск Issues."),
            ("提取评论时出错。","Ошибка при получении комментариев."),
            ("发布评论时出错","Ошибка при публикации комментария"),
            ("创建评论 issue 时出错","Ошибка при создании Issue для комментариев"),
            ("评论发布被禁止","Публикация комментариев запрещена"),
          ]
          for p in Path("src").rglob("*"):
            if p.suffix in (".ts",".html"):
              s=p.read_text()
              for a,b in R: s=s.replace(a,b)
              p.write_text(s)
          p=Path("src/client.ts")
          s=p.read_text()
          old=r"""const beaudarOrigin = script.src.match(
            /^https:\/\/beaudar.lipk\.org|http:\/\/localhost:\d+/,
          )![0];
          const frameUrl = `${beaudarOrigin}/beaudar.html`;"""
          new="""const scriptUrl = new URL(script.src);
          const beaudarOrigin = scriptUrl.origin;
          const frameUrl = new URL("beaudar.html", scriptUrl.href).href;"""
          assert old in s
          p.write_text(s.replace(old,new))
          p=Path("src/beaudar.html")
          s=p.read_text()
          s=s.replace("<html lang=\"zh-cn\">","<html lang=\"ru\">")
          s=s.replace("<title>Beaudar（表达）</title>","<title>Комментарии</title>")
          s=s.replace("使用 GitHub issue 的轻量级评论插件。官网地址: https://beaudar.lipk.org.","Комментарии через GitHub Issues.")
          p.write_text(s)
          PY
          npm ci
          npm run build
          cd ..
          rm -rf assets/beaudar
          mkdir -p assets/beaudar
          cp -R beaudar-build/dist/. assets/beaudar/
          rm -rf beaudar-build
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/beaudar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build local Russian Beaudar"
          git push
